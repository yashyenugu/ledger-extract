[project]
name = "ledger-extract-api"
version = "0.1.0"
description = "Ledger Extract API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "minio>=7.2",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
